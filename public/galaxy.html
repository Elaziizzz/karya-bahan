<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;background:#000;height:100%;overflow:hidden;}
  #scene{position:fixed; inset:0; width:100vw; height:100vh; display:block;}
  #scroll-host { height:300vh; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scroll-host"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';
import { CopyShader } from 'three/addons/shaders/CopyShader.js';

const Lerp = (a, b, t = 0.075) => a + (b - a) * t;
function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16);
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGL1Renderer({ canvas, antialias:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 0, 15);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 80);
camera.position.set(0, 0, 14);
scene.add(camera);

const LAYERS = { NONE:0, TORUS_SCENE:1, BLOOM_SCENE:2, ENTIRE_SCENE:3 };
camera.layers.enable(LAYERS.TORUS_SCENE);
camera.layers.enable(LAYERS.BLOOM_SCENE);
camera.layers.enable(LAYERS.ENTIRE_SCENE);

const renderScene = new RenderPass(scene, camera);

const torusComposer = new EffectComposer(renderer);
torusComposer.renderToScreen = false;
torusComposer.addPass(renderScene);
torusComposer.addPass(new ShaderPass(GammaCorrectionShader));
torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.22, 0.2, 0));
torusComposer.addPass(new ShaderPass(CopyShader));

const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(renderScene);
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.35, 0.5, 0));
bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));

const FinalPass = {
  uniforms: {
    iTime: { value: 0 }, tDiffuse: { value: null },
    torusTexture: { value: null }, bloomTexture: { value: null }, haloTexture: { value: null },
    iCornerBlue:   { value: hexToVec3('#ffcf2a') },
    iCornerOrange: { value: hexToVec3('#ff3b1f') },
  },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }",
  fragmentShader: "uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;\nuniform vec3 iCornerBlue; uniform vec3 iCornerOrange; varying vec2 vUv;\nvec3 warp3d(vec3 pos, float t) {\n  float curv = .8, a = 1.9, b = 0.7; pos *= 2.;\n  pos.x += curv * sin(t + a * pos.y) + t * b; pos.y += curv * cos(t + a * pos.x);\n  pos.y += curv * sin(t + a * pos.z) + t * b; pos.z += curv * cos(t + a * pos.y);\n  pos.z += curv * sin(t + a * pos.x) + t * b; pos.x += curv * cos(t + a * pos.z);\n  return 0.5 + 0.5 * cos(pos.xyz + vec3(1, 2, 4));\n}\nvoid main() {\n  vec2 uv = 2. * vUv - 1.;\n  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime * 1.5), vec3(1.5));\n  vec3 col = 1.5 * iCornerBlue * w.x; col *= w.y; col += iCornerOrange * w.z;\n  col *= smoothstep(0.6, 1., abs(uv.y));\n  col *= smoothstep(-.5, 1., -uv.y * uv.x); col *= smoothstep(-.5, 1., -uv.y * uv.x);\n  vec3 halo = texture2D(haloTexture, vUv).xyz;\n  vec3 atmoBg = vec3(0.02, 0.03, 0.10) * (1.0 - 0.4 * length(uv));\n  gl_FragColor = vec4(atmoBg + col * 0.2 + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);\n}"
};

const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(renderScene);
const finalPass = new ShaderPass(FinalPass);
finalComposer.addPass(finalPass);
finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture;
finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture;

class Galaxy {
  constructor() {
    this.count = { stars: 90000 };
    this.R = 1.7;
    const g = this.geometry();
    
    const uniforms = {
      iTime: { value: 0 },
      iAnimate: { value: 0 },
      uOpacity: { value: 1 },
      uExpand: { value: 1 },
      uWobbleAmount: { value: 0.205 },
      uWobbleSpeed: { value: 0.35 },
      uCore: { value: hexToVec3('#fff3b0') },
      uMid: { value: hexToVec3('#ffb52a') },
      uRim: { value: hexToVec3('#3a1402') },
      uTwinkle: { value: hexToVec3('#ff5e8a') },
      uGradientPow: { value: 0.2 },
      uTwinkleAmount: { value: 0.71 },
      uTwinkleSpeed: { value: 2.45 },
    };
    this.uniforms = uniforms;

    const mat = new THREE.ShaderMaterial({
      blending: THREE.AdditiveBlending,
      depthTest: false,
      transparent: true,
      uniforms: uniforms,
      vertexShader: "attribute float size; attribute float id; attribute float shell;\nuniform float iTime; uniform float iAnimate; uniform float uExpand;\nuniform float uWobbleAmount; uniform float uWobbleSpeed;\nvarying float vShell; varying float vId;\nvoid main() {\n  vShell = shell; vId = id;\n  float ph = id * 6.2831853;\n  vec3 wob = vec3(sin(iTime * uWobbleSpeed + ph),\n                  cos(iTime * uWobbleSpeed * 1.3 + ph),\n                  sin(iTime * uWobbleSpeed * 0.7 + ph)) * uWobbleAmount;\n  vec3 p = (position + wob) * uExpand;\n  vec4 mv = modelViewMatrix * vec4(p, 1.0);\n  gl_PointSize = size / -mv.z * (0.5 + 0.5 * iAnimate);\n  vec4 res = projectionMatrix * mv;\n  float a = pow(iAnimate, 0.6);\n  res.xy *= clamp(2.0 * a + pow(id, 0.7) - 1.0, 0.0, 1.0);\n  gl_Position = res;\n}",
      fragmentShader: "uniform float iTime; uniform float uOpacity;\nuniform vec3 uCore; uniform vec3 uMid; uniform vec3 uRim; uniform vec3 uTwinkle;\nuniform float uGradientPow; uniform float uTwinkleAmount; uniform float uTwinkleSpeed;\nvarying float vShell; varying float vId;\nvec3 grad3(vec3 a, vec3 b, vec3 c, float t) {\n  return t < 0.5 ? mix(a, b, t * 2.0) : mix(b, c, clamp((t - 0.5) * 2.0, 0.0, 1.0));\n}\nvoid main() {\n  float t = pow(vShell, uGradientPow);\n  vec3 col = grad3(uCore, uMid, uRim, t);\n  float tw = 0.5 + 0.5 * sin(iTime * uTwinkleSpeed + vId * 100.0);\n  col = mix(col, uTwinkle, tw * uTwinkleAmount * (1.0 - t));\n  col *= (0.45 + 0.85 * (1.0 - t));\n  float tex = 1.0 - smoothstep(0.5, 1.0, length(2.0 * gl_PointCoord - 1.0));\n  gl_FragColor = vec4(col * tex, tex * uOpacity);\n}"
    });

    this.cloud = new THREE.Points(g, mat);
    this.cloud.position.set(0, 0, -0.8);
    this.cloud.layers.set(LAYERS.ENTIRE_SCENE);

    this.group = new THREE.Group();
    this.group.add(this.cloud);
    this.group.position.z = -20;
    scene.add(this.group);
  }

  geometry() {
    const N = this.count.stars;
    const positions = new Float32Array(N * 3), shells = new Float32Array(N), sizes = new Float32Array(N), ids = new Float32Array(N);
    const K = Math.max(1, Math.round(79));
    const SP = 13;
    const frames = [];
    for (let k = 0; k < K; k++) {
      frames.push({
        m: new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(
          Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI)),
        size: 0.18 + 0.34 * Math.random(),
        ecc: 0.45 + 0.42 * Math.random(),
        thick: 0.06 + 0.05 * Math.random(),
        ox: (Math.random() - 0.5) * 2 * SP,
        oy: (Math.random() - 0.5) * 2 * SP,
        oz: (Math.random() - 0.5) * 2 * SP * 0.6
      });
    }
    const tmp = new THREE.Vector3();
    for (let i = 0; i < N; i++) {
      const f = frames[i % K];
      const th = Math.random() * 2 * Math.PI;
      const rad = Math.pow(Math.random(), 1.4);
      const rx = f.size * this.R * rad;
      const rz = f.size * this.R * f.ecc * rad;
      const y = (Math.random() - 0.5) * 2 * f.thick * this.R * rad;
      tmp.set(rx * Math.cos(th), y, rz * Math.sin(th)).applyMatrix4(f.m);
      tmp.x += f.ox; tmp.y += f.oy; tmp.z += f.oz;
      positions[i * 3]     = tmp.x;
      positions[i * 3 + 1] = tmp.y;
      positions[i * 3 + 2] = tmp.z;
      shells[i] = rad;
      sizes[i]  = 6 + 9 * Math.random();
      ids[i]    = Math.random();
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setAttribute('shell',    new THREE.BufferAttribute(shells, 1));
    g.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));
    g.setAttribute('id',       new THREE.BufferAttribute(ids, 1));
    return g;
  }

  render(scrollT, t, dt) {
    this.uniforms.iTime.value = t;
    this.uniforms.uExpand.value = 1 + scrollT * 1;
    const spin = 0.2 * (1 + scrollT * 2.62) * dt;
    this.cloud.rotation.y += spin;
    this.cloud.rotation.x += spin * 0.35;
  }
}

const galaxy = new Galaxy();

// ATMO
const atmoCount = 350;
const aPos = new Float32Array(atmoCount * 3), aSizes = new Float32Array(atmoCount), aSeeds = new Float32Array(atmoCount);
for (let i = 0; i < atmoCount; i++) {
  aPos[i*3] = 2*Math.random()-1; aPos[i*3+1] = 2*Math.random()-1; aPos[i*3+2] = 2*Math.random()-1;
  aSizes[i] = 14 * (0.4 + Math.random()); aSeeds[i] = Math.random();
}
const aGeo = new THREE.BufferGeometry();
aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
aGeo.setAttribute('size', new THREE.BufferAttribute(aSizes, 1));
aGeo.setAttribute('seed', new THREE.BufferAttribute(aSeeds, 1));

const atmoMat = new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: hexToVec3('#ffd9a0') },
    uRes: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) }
  },
  vertexShader: "attribute float size; attribute float seed; uniform float uTime; uniform vec2 uRes;\nvarying float vA;\nvec3 warp(vec3 p, float t){ float c=0.9,a=1.9,b=0.02,s=0.05; p*=2.;\n  p.x+=c*sin(s*t+a*p.y)+t*b; p.y+=c*cos(s*t+a*p.x); p.y+=c*sin(s*t+a*p.z)+t*b;\n  p.z+=c*cos(s*t+a*p.y); p.z+=c*sin(s*t+a*p.x)+t*b; p.x+=c*cos(s*t+a*p.z);\n  return cos(p+vec3(1,2,4)); }\nvoid main(){\n  vec3 v = position*4.0 + warp(position, uTime)*1.2;\n  vec4 mv = modelViewMatrix * vec4(v, 1.0);\n  float r = length(v); float farF = 1.0 - smoothstep(5.0, 6.5, r); float nearF = smoothstep(0.0, 0.5, -mv.z);\n  vA = farF * nearF;\n  gl_PointSize = size * uRes.y / 900.0 / -mv.z; gl_PointSize = max(gl_PointSize, 1.0);\n  gl_Position = projectionMatrix * mv;\n}",
  fragmentShader: "uniform vec3 uColor; varying float vA;\nvoid main(){ vec2 p = gl_PointCoord - 0.5; float l = length(p); if (l > 0.5) discard;\n  float tex = smoothstep(0.5, 0.0, l); gl_FragColor = vec4(uColor * tex, tex * vA * 0.55); }"
});
const atmoPts = new THREE.Points(aGeo, atmoMat);
atmoPts.frustumCulled = false;
atmoPts.layers.set(LAYERS.ENTIRE_SCENE);
scene.add(atmoPts);

let scrollTarget = 0, scrollCurrent = 0;
function updateScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  scrollTarget = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
}
window.addEventListener('scroll', updateScroll, { passive: true }); updateScroll();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(dpr);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  torusComposer.setSize(w, h);
  torusComposer.setPixelRatio(dpr);
  bloomComposer.setSize(w, h);
  bloomComposer.setPixelRatio(dpr);
  finalComposer.setSize(w, h);
  finalComposer.setPixelRatio(dpr);
  updateScroll();
});

const start = performance.now();
let lastT = start / 1000;

function render() {
  requestAnimationFrame(render);
  const now = performance.now();
  const t = now / 1000;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  let tAnim = clamp((now - start) / 2000, 0, 1);
  galaxy.uniforms.iAnimate.value = (now - start >= 2000) ? 1 : (tAnim * tAnim * (3 - 2 * tAnim));
  
  let tSlide = clamp((now - (start + 500)) / 1500, 0, 1);
  galaxy.group.position.z = Lerp(-20, 0, 1 - Math.pow(1 - tSlide, 4));
  galaxy.uniforms.uOpacity.value = tSlide;

  scrollCurrent = Lerp(scrollCurrent, scrollTarget, 0.08);
  camera.position.z = 14 - scrollCurrent * 4;

  galaxy.render(scrollCurrent, t, dt);

  atmoMat.uniforms.uTime.value = t * 0.8 * 8.0;
  atmoPts.position.copy(camera.position);

  finalPass.uniforms.iTime.value = t;
  
  camera.layers.set(LAYERS.TORUS_SCENE);  torusComposer.render();
  camera.layers.set(LAYERS.BLOOM_SCENE);  bloomComposer.render();
  camera.layers.set(LAYERS.ENTIRE_SCENE); finalComposer.render();
}
render();
</script>
</body>
</html>
